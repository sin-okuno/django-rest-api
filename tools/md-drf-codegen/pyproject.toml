[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md-drf-codegen"
version = "0.2.0"
description = "Markdown/YAML driven DRF API code generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "typer>=0.12",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "Django>=5.0,<6",
  "djangorestframework>=3.15",
]

[project.scripts]
md-drf-codegen = "md_drf_codegen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
md_drf_codegen = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
DJANGO_SETTINGS_MODULE = "django_settings"
django_find_project = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["generated", "generated-specs", "examples/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["md_drf_codegen"]
warn_unused_configs = true
